services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/db
      - REDIS_URL=redis://redis:6379/0
      - APP_NAME=App
      - SECRET_KEY=53bd75c62d71250aa002f0cff32cbe858661bb1159e15cdf454dd19b75a563f9
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10
      - REFRESH_TOKEN_EXPIRE_DAYS=14
      - ACTIVATE_TOKEN_EXPIRE_DAYS=1
      - PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=60
      - FIRST_SUPERUSER="admin"
      - MAIL_SERVER=mailpit # tu wpisujesz nazwę serwisu zamiast localhost
      - MAIL_PORT=1025
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025" # UI w przeglądarce pod adresem http://localhost:8025
      - "1025:1025" # Nasz serwer wpisany w configu (SMTP PORT)
  
  init-certs:
    image: alpine/openssl
    container_name: init_certs
    entrypoint: /bin/sh
    volumes:
      - ./nginx/certs:/certs
    command: >
      -c "if [ ! -f /certs/server.crt ]; then
              echo 'Generating self-signed certificate...';
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /certs/server.key -out /certs/server.crt -subj '/CN=localhost';
              chmod 644 /certs/server.key /certs/server.crt;
            else
              echo 'Certificate already exists.';
            fi"

  nginx:
    image: nginx:latest
    container_name: creatorhub_nginx
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - init-certs

volumes:
  postgres_data:
  redis_data: