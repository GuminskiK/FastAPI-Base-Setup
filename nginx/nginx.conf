events {
    worker_connections 1000;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Definicja strefy limitu: klucz to IP ($binary_remote_addr), pamięć 10MB, limit 10 req/s (globalnie dla IP)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

    upstream fastapi_app {
        # 'backend' to nazwa serwisu w docker-compose
        server backend:8000;
    }

    # Przekierowanie HTTP -> HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;
        
        client_max_body_size 25M;

        # Certyfikaty (muszą być zamontowane w wolumenie)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Zalecane ustawienia SSL (proste)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend - Static Files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Ochrona przed DDoS (nginx level)
            limit_req zone=general_limit burst=20 nodelay;
        }

        # Backend API
        location /api/ {
            # Strip /api prefix
            rewrite ^/api/(.*) /$1 break;
            
            # Ochrona przed botami na API
            limit_req zone=general_limit burst=20 nodelay;
            
            proxy_pass http://fastapi_app;
            
            # Nagłówki, by aplikacja wiedziała że jest za proxy
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Backend Docs (Optional, if needed directly)
        location /docs {
             proxy_pass http://fastapi_app;
             proxy_set_header Host $http_host;
        }
        
        location /openapi.json {
             proxy_pass http://fastapi_app;
             proxy_set_header Host $http_host;
        }
    }
}